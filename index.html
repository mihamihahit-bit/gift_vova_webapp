<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Крутить колесо</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #17212b; color: white; font-family: Arial; text-align: center; padding: 20px; }
        .wheel-container { width: 250px; height: 250px; margin: 30px auto; position: relative; }
        .wheel { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#ff4b4b 0deg 45deg, #4bff4b 45deg 90deg, #4b9eff 90deg 135deg, #ffdb4b 135deg 180deg, #ff4b4b 180deg 225deg, #4bff4b 225deg 270deg, #4b9eff 270deg 315deg, #ffdb4b 315deg 360deg); border: 5px solid #fff; transition: transform 4s cubic-bezier(0.25, 1, 0.5, 1); box-sizing: border-box; }
        .arrow { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); font-size: 40px; z-index: 10; }
        button { background-color: #2481cc; color: white; border: none; padding: 15px 40px; font-size: 18px; border-radius: 10px; cursor: pointer; margin-top: 20px; font-weight: bold; }
        button:disabled { background-color: #555; }
        .result { margin-top: 20px; font-size: 20px; font-weight: bold; color: #ffdb4b; }
    </style>
</head>
<body>
    <h1>🎡 Колесо Фортуны</h1>
    <p>Нажми, чтобы испытать удачу!</p>
    
    <div class="wheel-container">
        <div class="arrow">▼</div>
        <div class="wheel" id="wheel"></div>
    </div>
    
    <button id="spinBtn" onclick="spin()">Крутить!</button>
    <div class="result" id="result"></div>

    <script>
        let isSpinning = false;
        let currentRotation = 0;

        function spin() {
            if (isSpinning) return;
            isSpinning = true;
            document.getElementById('spinBtn').disabled = true;
            document.getElementById('result').innerText = "";
            
            const wheel = document.getElementById('wheel');
            // Случайный поворот (минимум 5 полных кругов + случайный угол)
            const randomDeg = Math.floor(1800 + Math.random() * 360); 
            currentRotation += randomDeg;
            wheel.style.transform = `rotate(${currentRotation}deg)`;
            
            // Определяем выигрыш (делим на сектора по 45 градусов)
            const sector = Math.floor((currentRotation % 360) / 45);
            let prize = "Пусто 😔";
            
            // Шансы (0-7 сектора)
            if (sector === 0 || sector === 4) prize = "+50 баллов";
            if (sector === 1 || sector === 5) prize = "🧸 Мишка";
            if (sector === 2 || sector === 6) prize = "+100 баллов";
            if (sector === 3 || sector === 7) prize = "💎 Алмаз";

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('spinBtn').disabled = false;
                document.getElementById('result').innerText = "Выпало: " + prize;
                
                // Отправляем данные боту
                if (window.Telegram && window.Telegram.WebApp) {
                    window.Telegram.WebApp.sendData(JSON.stringify({ action: "spin", prize: prize }));
                }
            }, 4000);
        }
    </script>
</body>
</html>
